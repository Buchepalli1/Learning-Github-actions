name: my-first-workflow
# To get trigger on every push in this repo in any branch
on: push

jobs:
  job1:
    name: job1
    runs-on: windows-latest
    steps:
      - name: Running single command in job1
        run: echo "Hi this is my first Github workflow"
      - name: Checking Windows version
        shell: pwsh
        run: Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
